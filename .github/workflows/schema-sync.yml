name: Schema Sync

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-sync:
    name: Schema Sync
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate schema
        run: pnpm generate-schema

      - name: Verify schema/Configuration.json is up to date
        run: |
          if ! git diff --exit-code --ignore-blank-lines schema/Configuration.json; then
            echo "::error file=schema/Configuration.json::schema/Configuration.json が src/config.ts と同期していません。pnpm generate-schema を実行して差分をコミットしてください。"
            exit 1
          fi
